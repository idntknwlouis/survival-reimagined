plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.shedaniel.me' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://www.cursemaven.com'}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}


loom {
	runs {
		client {
			client()
			configName = "Minecraft Client"
			ideConfigGenerated = true
			runDir = "run"
			programArgs "--username", "Dev"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Keep Mojang's official names so the existing NeoForge source needs far fewer mapping changes.
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI is optional for players, but available in dev so custom machine recipes can be tested.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// The NeoForge version uses MixinExtras 0.5.3 in several mixins.
	include(modImplementation("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"))

	// TerraBlender is required for Fabric Version to allow Mod-Specific Biome Generation
	modImplementation "curse.maven:terrablender-fabric-565956:6054948"
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"

	// Optional worldgen compatibility test stack. Enable with -Penable_c2me_runtime=true.
	// These are NOT bundled and are NOT required by Survival Reimagined.
	if (project.findProperty("enable_c2me_runtime") == "true") {
		// Do not use Loom's modLocalRuntime here: Loom strips nested jars from
		// mod dependencies, while C2ME ships its internal modules as nested jars.
		// Keeping the production jars intact lets Fabric Loader discover
		// c2me-base, c2me-opts-dfc, c2me-rewrites-chunk-system, etc.
		runtimeOnly "maven.modrinth:VSNURh3q:${project.c2me_version_id}"
		runtimeOnly "maven.modrinth:qtPMklut:${project.c2me_opencl_version_id}"
		runtimeOnly "maven.modrinth:Ps1zyz6x:${project.scalablelux_version_id}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// IntelliJ's generated Fabric dev run can invoke compileJava without refreshing resources.
// Keep build/resources/main in sync so lang files, models and GUI textures are never stale.
tasks.named("compileJava") {
	finalizedBy tasks.named("processResources")
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
