plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.shedaniel.me' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://www.cursemaven.com'}
	maven { url = 'https://maven.terraformersmc.com/releases/'}
	maven { url = 'https://api.modrinth.com/maven' }
}

loom {
	runs {
		client {
			client()
			configName = "Minecraft Client"
			ideConfigGenerated = true
			runDir = "run"
			programArgs "--username", "Dev"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional JEI integration: compile against its API and include it only in dev runs.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// Optional Jade integration: compile against the API and include it only in dev runs.
	modCompileOnly "maven.modrinth:jade:${project.jade_version}"
	modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

	include(modImplementation("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"))
	modImplementation "curse.maven:terrablender-fabric-565956:6054948"
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
	modImplementation "curse.maven:serene-seasons-291874:6182595"
	modApi "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("compileJava") {
	finalizedBy tasks.named("processResources")
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
