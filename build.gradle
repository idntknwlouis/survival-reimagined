plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://www.cursemaven.com'}
}


loom {
	runs {
		client {
			programArg "--username"
			programArg "Dev"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Keep Mojang's official names so the existing NeoForge source needs far fewer mapping changes.
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI is optional for players, but available in dev so custom machine recipes can be tested.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// The NeoForge version uses MixinExtras 0.5.3 in several mixins.
	include(modImplementation("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"))

	// TerraBlender is required for Fabric Version to allow Mod-Specific Biome Generation
	modImplementation "curse.maven:terrablender-fabric-565956:6054948"
	implementation "com.electronwill.night-config:core:3.8.1"
	implementation "com.electronwill.night-config:toml:3.8.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
